<svg width="400" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame 1: Standing/Running pose 1 -->
  <g id="frame1">
    <!-- Sketchbook body -->
    <rect x="15" y="20" width="35" height="40" fill="white" stroke="black" stroke-width="2" rx="2"/>
    <!-- Spiral binding -->
    <circle cx="10" cy="25" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="30" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="35" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="40" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="45" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="50" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="55" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <!-- Face -->
    <circle cx="25" cy="35" r="2" fill="black"/>
    <circle cx="35" cy="35" r="2" fill="black"/>
    <path d="M 25 45 Q 30 50 35 45" stroke="black" stroke-width="1.5" fill="none"/>
    <!-- Pencil -->
    <rect x="50" y="15" width="4" height="25" fill="#F4A460" stroke="black" stroke-width="1"/>
    <polygon points="52,10 50,15 54,15" fill="black"/>
    <rect x="50" y="40" width="4" height="8" fill="#FFB6C1" stroke="black" stroke-width="1"/>
    <!-- Arms -->
    <line x1="15" y1="30" x2="5" y2="25" stroke="black" stroke-width="2"/>
    <line x1="50" y1="30" x2="52" y2="15" stroke="black" stroke-width="2"/>
    <!-- Legs - running pose 1 -->
    <line x1="20" y1="60" x2="15" y2="75" stroke="black" stroke-width="2"/>
    <line x1="40" y1="60" x2="45" y2="75" stroke="black" stroke-width="2"/>
    <!-- Feet -->
    <ellipse cx="13" cy="77" rx="5" ry="2" fill="black"/>
    <ellipse cx="47" cy="77" rx="5" ry="2" fill="black"/>
  </g>
  
  <!-- Frame 2: Running pose 2 (legs switched) -->
  <g id="frame2" transform="translate(100,0)">
    <!-- Sketchbook body -->
    <rect x="15" y="20" width="35" height="40" fill="white" stroke="black" stroke-width="2" rx="2"/>
    <!-- Spiral binding -->
    <circle cx="10" cy="25" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="30" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="35" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="40" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="45" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="50" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="55" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <!-- Face -->
    <circle cx="25" cy="35" r="2" fill="black"/>
    <circle cx="35" cy="35" r="2" fill="black"/>
    <path d="M 25 45 Q 30 50 35 45" stroke="black" stroke-width="1.5" fill="none"/>
    <!-- Pencil -->
    <rect x="50" y="15" width="4" height="25" fill="#F4A460" stroke="black" stroke-width="1"/>
    <polygon points="52,10 50,15 54,15" fill="black"/>
    <rect x="50" y="40" width="4" height="8" fill="#FFB6C1" stroke="black" stroke-width="1"/>
    <!-- Arms -->
    <line x1="15" y1="30" x2="8" y2="35" stroke="black" stroke-width="2"/>
    <line x1="50" y1="30" x2="52" y2="15" stroke="black" stroke-width="2"/>
    <!-- Legs - running pose 2 (opposite) -->
    <line x1="20" y1="60" x2="25" y2="75" stroke="black" stroke-width="2"/>
    <line x1="40" y1="60" x2="35" y2="75" stroke="black" stroke-width="2"/>
    <!-- Feet -->
    <ellipse cx="27" cy="77" rx="5" ry="2" fill="black"/>
    <ellipse cx="33" cy="77" rx="5" ry="2" fill="black"/>
  </g>
  
  <!-- Frame 3: Mid-run pose -->
  <g id="frame3" transform="translate(200,0)">
    <!-- Sketchbook body (slightly bouncing) -->
    <rect x="15" y="18" width="35" height="40" fill="white" stroke="black" stroke-width="2" rx="2"/>
    <!-- Spiral binding -->
    <circle cx="10" cy="23" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="28" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="33" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="38" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="43" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="48" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="53" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <!-- Face -->
    <circle cx="25" cy="33" r="2" fill="black"/>
    <circle cx="35" cy="33" r="2" fill="black"/>
    <path d="M 25 43 Q 30 48 35 43" stroke="black" stroke-width="1.5" fill="none"/>
    <!-- Pencil -->
    <rect x="50" y="13" width="4" height="25" fill="#F4A460" stroke="black" stroke-width="1"/>
    <polygon points="52,8 50,13 54,13" fill="black"/>
    <rect x="50" y="38" width="4" height="8" fill="#FFB6C1" stroke="black" stroke-width="1"/>
    <!-- Arms (more dynamic) -->
    <line x1="15" y1="28" x2="3" y2="30" stroke="black" stroke-width="2"/>
    <line x1="50" y1="28" x2="52" y2="13" stroke="black" stroke-width="2"/>
    <!-- Legs - mid-run -->
    <line x1="20" y1="58" x2="18" y2="73" stroke="black" stroke-width="2"/>
    <line x1="40" y1="58" x2="42" y2="73" stroke="black" stroke-width="2"/>
    <!-- Feet -->
    <ellipse cx="16" cy="75" rx="5" ry="2" fill="black"/>
    <ellipse cx="44" cy="75" rx="5" ry="2" fill="black"/>
  </g>
  
  <!-- Frame 4: Running pose 4 -->
  <g id="frame4" transform="translate(300,0)">
    <!-- Sketchbook body -->
    <rect x="15" y="20" width="35" height="40" fill="white" stroke="black" stroke-width="2" rx="2"/>
    <!-- Spiral binding -->
    <circle cx="10" cy="25" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="30" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="35" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="40" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="45" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="50" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="10" cy="55" r="2" fill="none" stroke="black" stroke-width="1.5"/>
    <!-- Face -->
    <circle cx="25" cy="35" r="2" fill="black"/>
    <circle cx="35" cy="35" r="2" fill="black"/>
    <path d="M 25 45 Q 30 50 35 45" stroke="black" stroke-width="1.5" fill="none"/>
    <!-- Pencil -->
    <rect x="50" y="15" width="4" height="25" fill="#F4A460" stroke="black" stroke-width="1"/>
    <polygon points="52,10 50,15 54,15" fill="black"/>
    <rect x="50" y="40" width="4" height="8" fill="#FFB6C1" stroke="black" stroke-width="1"/>
    <!-- Arms -->
    <line x1="15" y1="30" x2="12" y2="20" stroke="black" stroke-width="2"/>
    <line x1="50" y1="30" x2="52" y2="15" stroke="black" stroke-width="2"/>
    <!-- Legs - running pose 4 -->
    <line x1="20" y1="60" x2="22" y2="75" stroke="black" stroke-width="2"/>
    <line x1="40" y1="60" x2="38" y2="75" stroke="black" stroke-width="2"/>
    <!-- Feet -->
    <ellipse cx="24" cy="77" rx="5" ry="2" fill="black"/>
    <ellipse cx="36" cy="77" rx="5" ry="2" fill="black"/>
  </g>
</svg>